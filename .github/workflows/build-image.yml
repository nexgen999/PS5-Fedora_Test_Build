name: Build Image
run-name: >-
  Build Image (${{ inputs.distro || 'fedora' }} · ${{
    (inputs.all_editions == false || inputs.all_editions == 'false')
      && 'édition(s) choisie(s)' || 'toutes les éditions' }})

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution'
        default: 'fedora'
        type: choice
        options: [fedora]
      all_editions:
        description: 'Tout construire — décocher pour choisir avec les cases ci-dessous'
        type: boolean
        default: true
      variant:
        description: 'Éditions à ajouter (noms sans .yaml, séparés par des virgules)'
        type: string
        default: ''
      skip_editions:
        description: 'Éditions à exclure (noms sans .yaml, séparés par des virgules)'
        type: string
        default: ''
      # --- Une case par YAML de distros/fedora/ : cocher = construire cette
      # édition. Ces cases ne servent que si « Tout construire » est décoché ;
      # tant qu'il reste coché, un YAML ajouté plus tard est pris tout seul.
      image:
        description: 'image — base GNOME (ps5-fedora)'
        type: boolean
        default: false
      fedora-budgie_edition:
        description: 'fedora-budgie_edition — Budgie (ps5-fedora-budgie_edition)'
        type: boolean
        default: false
      fedora-cinnamon_edition:
        description: 'fedora-cinnamon_edition — Cinnamon X11 (ps5-fedora-cinnamon_edition)'
        type: boolean
        default: false
      fedora-cosmic_edition:
        description: 'fedora-cosmic_edition — COSMIC (ps5-fedora-cosmic_edition)'
        type: boolean
        default: false
      fedora-desktop_edition:
        description: 'fedora-desktop_edition — GNOME allégé (ps5-fedora-desktop_edition)'
        type: boolean
        default: false
      fedora-dev_edition:
        description: 'fedora-dev_edition — GNOME développeur (ps5-fedora-dev_edition)'
        type: boolean
        default: false
      fedora-gaming_edition:
        description: 'fedora-gaming_edition — GNOME gaming (ps5-fedora-gaming_edition)'
        type: boolean
        default: false
      fedora-kde_edition:
        description: 'fedora-kde_edition — KDE Plasma (ps5-fedora-kde_edition)'
        type: boolean
        default: false
      fedora-minimal_setup:
        description: 'fedora-minimal_setup — CLI/SSH (ps5-fedora-minimal_setup)'
        type: boolean
        default: false
      fedora-miraclewm_edition:
        description: 'fedora-miraclewm_edition — Miracle WM (ps5-fedora-miraclewm_edition)'
        type: boolean
        default: false
      fedora-niri_edition:
        description: 'fedora-niri_edition — Niri (ps5-fedora-niri_edition)'
        type: boolean
        default: false
      fedora-sway_edition:
        description: 'fedora-sway_edition — Sway (ps5-fedora-sway_edition)'
        type: boolean
        default: false
      fedora-test_build:
        description: 'fedora-test_build — copie de test (ps5-fedora-test_build)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      distro:
        description: 'Distribution'
        type: string
        default: 'fedora'
      variant:
        description: 'Extra edition stems, comma separated. Empty = every edition.'
        type: string
        default: ''
      skip_editions:
        description: 'Edition stems to exclude, comma separated.'
        type: string
        default: ''
      all_editions:
        description: 'Build every edition discovered in distros/<distro>/*.yaml.'
        type: boolean
        default: true

env:
  DISTRO: ${{ inputs.distro || 'fedora' }}
  # Nombre de releases datées conservées (une release par run, pas par édition).
  KEEP_RELEASES: '5'

jobs:
  # List every edition YAML (distros/<distro>/*.yaml) so that adding a new
  # edition file is all it takes to get a new build, archives and release.
  editions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout image builder
        uses: actions/checkout@v6
        with:
          path: image

      - name: List editions
        id: list
        shell: bash
        env:
          ONLY: ${{ inputs.variant || '' }}
          SKIP: ${{ inputs.skip_editions || '' }}
          ALL_EDITIONS: ${{ inputs.all_editions }}
          FORM: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          dir="image/distros/${DISTRO}"
          [ -d "$dir" ] || { echo "::error::No edition directory: $dir"; exit 1; }
          mapfile -t all < <(find "$dir" -maxdepth 1 -type f -name '*.yaml' -printf '%f\n' \
            | sed 's/\.yaml$//' | sort)
          [ ${#all[@]} -gt 0 ] || { echo "::error::No *.yaml editions in $dir"; exit 1; }

          declare -A known=() pick=() drop=()
          for edition in "${all[@]}"; do known["$edition"]=1; done

          # Découpe une liste « a, b,c » en un nom par ligne.
          words() { tr ', \t' '\n\n\n' <<<"${1:-}" | sed '/^$/d'; }

          # Cases cochées dans le formulaire : la clé de l'entrée est le nom du YAML.
          mapfile -t ticked < <(jq -r 'to_entries[]
            | select(.key != "all_editions" and .key != "distro")
            | select(.value == true) | .key' <<<"$FORM")

          if [ "${ALL_EDITIONS:-false}" = "true" ]; then
            for edition in "${all[@]}"; do pick["$edition"]=1; done
          fi

          for edition in "${ticked[@]}"; do
            if [ -n "${known[$edition]:-}" ]; then
              pick["$edition"]=1
            else
              echo "::warning::Case « $edition » cochée mais ${dir}/${edition}.yaml n'existe pas : ignorée."
            fi
          done

          while IFS= read -r edition; do
            if [ -z "${known[$edition]:-}" ]; then
              echo "::error::Unknown edition '$edition'. Available: ${all[*]}"
              exit 1
            fi
            pick["$edition"]=1
          done < <(words "$ONLY")

          while IFS= read -r edition; do
            if [ -z "${known[$edition]:-}" ]; then
              echo "::warning::Exclusion ignorée, édition inconnue : '$edition'."
            fi
            drop["$edition"]=1
          done < <(words "$SKIP")

          selected=()
          for edition in "${all[@]}"; do
            if [ -n "${pick[$edition]:-}" ] && [ -z "${drop[$edition]:-}" ]; then
              selected+=("$edition")
            fi
          done

          [ ${#selected[@]} -gt 0 ] || {
            echo "::error::Aucune édition sélectionnée. Cochez « Tout construire », cochez une ou plusieurs cases, ou renseignez 'variant'."
            exit 1
          }

          json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          echo "list=$json" >> "$GITHUB_OUTPUT"
          echo "Editions to build (${#selected[@]}/${#all[@]}): $json"
          {
            echo "### Éditions construites (${#selected[@]}/${#all[@]})"
            echo
            printf -- '- `%s`\n' "${selected[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The kernel is identical for every edition: compile it once, then feed the
  # package to each image build (build_image.sh skips the kernel stage when
  # linux-bin/*.rpm is already there).
  kernel:
    needs: editions
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      kver: ${{ steps.info.outputs.kver }}
      psha: ${{ steps.info.outputs.psha }}
    steps:
      - name: Checkout image builder
        uses: actions/checkout@v6
        with:
          path: image

      # The kernel only depends on the PS5 patch tag selected in build_image.sh
      # (PATCHES_REF) and on the kernel builder recipes. When both are unchanged
      # the packaged .rpm is restored from the cache and the ~45 min compile is
      # skipped. Anything else (tag bumped, Dockerfile/scripts touched) changes
      # the key and forces a rebuild.
      - name: Resolve kernel cache key
        id: kkey
        shell: bash
        run: |
          set -euo pipefail
          ref=$(sed -nE 's/^PATCHES_REF="(.*)"/\1/p' image/build_image.sh | head -1)
          [ -n "$ref" ] || { echo "::error::PATCHES_REF not found in image/build_image.sh"; exit 1; }
          psha=$(git ls-remote https://github.com/ps5-linux/ps5-linux-patches "$ref" 2>/dev/null \
                   | awk 'NR==1{print $1}')
          [ -n "${psha:-}" ] || psha="noref-${ref}"
          recipe=$(
            {
              cat image/docker/kernel-builder/Dockerfile image/docker/kernel-builder-rpm/Dockerfile
              find image/docker/kernel-builder image/docker/kernel-builder-rpm -type f | sort | xargs -r cat
              sed -nE 's/^(PATCHES_REF|PATCHES_REPO|LINUX_REPO)=//p' image/build_image.sh
            } | sha256sum | cut -c1-16
          )
          key="kernel-rpm-${psha:0:16}-${recipe}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "psha=$psha" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Kernel cache key: $key (patches $ref @ ${psha:0:12})"

      - name: Restore cached kernel package
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: kernel-pkg
          key: ${{ steps.kkey.outputs.key }}

      - name: Reuse cached kernel package
        if: steps.kcache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image/linux-bin
          cp -v kernel-pkg/*.rpm image/linux-bin/
          if [ -f kernel-pkg/VERSION ]; then
            cp -v kernel-pkg/VERSION image/linux-bin/
          fi
          echo "Kernel package restored from cache: compilation skipped."

      - name: Build PS5 kernel package (.rpm)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: bash image/build_image.sh --distro "${DISTRO}" --variant image --kernel-only

      - name: Collect kernel version info
        id: info
        shell: bash
        run: |
          kver=$(cat image/linux-bin/VERSION 2>/dev/null || echo unknown)
          psha=$(git -C image/work/ps5-linux-patches rev-parse --short HEAD 2>/dev/null \
                 || sed -n 's/^patches_sha=//p' kernel-pkg/BUILD_INFO 2>/dev/null | cut -c1-7 \
                 || echo unknown)
          [ -n "${psha:-}" ] || psha="unknown"
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "psha=$psha" >> "$GITHUB_OUTPUT"

      # linux-bin/ also holds the staging tree written by the build container,
      # which is root-owned (upload-artifact runs as the runner and cannot read
      # some of those files). Only the .rpm is needed by the image builds, so
      # copy it into a runner-owned directory and publish that.
      - name: Collect kernel package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(image/linux-bin/*.rpm)
          [ ${#rpms[@]} -gt 0 ] || { echo "::error::no .rpm produced in image/linux-bin"; exit 1; }
          mkdir -p kernel-pkg
          sudo cp "${rpms[@]}" kernel-pkg/
          if [ -f image/linux-bin/VERSION ]; then
            sudo cp image/linux-bin/VERSION kernel-pkg/
          fi
          sudo chown "$(id -u):$(id -g)" kernel-pkg/*
          chmod 0644 kernel-pkg/*
          built_sha=$(git -C image/work/ps5-linux-patches rev-parse HEAD 2>/dev/null \
                      || sed -n 's/^patches_sha=//p' kernel-pkg/BUILD_INFO 2>/dev/null || true)
          [ -n "${built_sha:-}" ] || built_sha='${{ steps.kkey.outputs.psha }}'
          {
            echo "patches_ref=${{ steps.kkey.outputs.ref }}"
            echo "patches_sha=$built_sha"
            echo "kernel=$(cat kernel-pkg/VERSION 2>/dev/null || echo unknown)"
            echo "cache_key=${{ steps.kkey.outputs.key }}"
          } > kernel-pkg/BUILD_INFO
          chmod 0644 kernel-pkg/BUILD_INFO
          cat kernel-pkg/BUILD_INFO
          ls -lh kernel-pkg/

      - name: Upload kernel package
        uses: actions/upload-artifact@v6
        with:
          name: kernel-rpm
          path: kernel-pkg/
          retention-days: 7
          if-no-files-found: error

      # Only a freshly compiled kernel is stored: a cache hit is already in the
      # cache, so re-saving it would waste the repository cache budget.
      - name: Save kernel package cache
        if: steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-pkg
          key: ${{ steps.kkey.outputs.key }}

  build:
    needs: [editions, kernel]
    runs-on: ubuntu-latest
    # Room for a slow rootfs + 7z run, without parking a runner for 6 h.
    timeout-minutes: 150
    concurrency:
      group: ps5-image-${{ matrix.edition }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      # One job per edition, all at the same time: every leg gets its own
      # runner, so nothing is shared. max-parallel is deliberately unset (the
      # whole matrix starts at once) and GitHub queues whatever exceeds the
      # account's concurrent-job limit. fail-fast must stay false so one broken
      # edition never cancels the others.
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.editions.outputs.list) }}

    steps:
      - name: Checkout image builder
        uses: actions/checkout@v6
        with:
          path: image

      - name: Fetch kernel package
        uses: actions/download-artifact@v6
        with:
          name: kernel-rpm
          path: image/linux-bin

      # A failing edition must never stop the editions that come after it, and
      # the ones that succeed must still be published. The build step is
      # therefore isolated (continue-on-error) and the remaining steps are
      # skipped when it fails; a last step fails the job again so the run stays
      # honest about the broken edition.
      - name: Build ${{ matrix.edition }} image
        id: build
        continue-on-error: true
        run: bash image/build_image.sh --distro "${DISTRO}" --variant "${{ matrix.edition }}"

      - name: Report
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          img=$(bash image/build_image.sh --distro "${DISTRO}" --variant "${{ matrix.edition }}" --print-name)
          test -f "image/output/${img}.img"
          ls -lh "image/output/${img}.img"
          # The image itself is not published (only the 7z volumes, hashed in
          # "Save build metadata"), so skip a 12 GB read just to log a hash.

      - name: Compress and split image into 1.5GB parts (7z)
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y p7zip-full
          img=$(bash image/build_image.sh --distro "${DISTRO}" --variant "${{ matrix.edition }}" --print-name)
          # 1.5 GiB volumes keep each archive under GitHub's 2 GiB file limit.
          7z a -t7z -mx=4 -v1500m "image/output/${img}.img.7z" "image/output/${img}.img"

      - name: Save build metadata
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          img=$(bash image/build_image.sh --distro "${DISTRO}" --variant "${{ matrix.edition }}" --print-name)
          sha256sum image/output/*.img.7z.* | sed 's|image/output/||' > "meta/${img}.sha256"
          echo "$img" > meta/img_name
          echo "${{ matrix.edition }}" > meta/edition
          echo "${{ needs.kernel.outputs.kver }}" > meta/kver
          echo "${{ needs.kernel.outputs.psha }}" > meta/psha
          date -u +%Y%m%d-%H%M%S > meta/ts
          sed -n 's/^  description:[[:space:]]*//p' "image/distros/${DISTRO}/${{ matrix.edition }}.yaml" \
            | head -1 | sed 's/^"//; s/"$//' > meta/description

      - name: Upload build metadata
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: meta-${{ matrix.edition }}
          path: meta/
          retention-days: 1

      - name: Upload image parts artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ps5-${{ matrix.edition }}-img
          path: image/output/*.img.7z.*
          retention-days: 7
          if-no-files-found: error

      # Re-raise the failure now that the other matrix entries are safe: the job
      # turns red, the siblings keep building (fail-fast: false) and the release
      # job still publishes every edition that produced its archives.
      - name: Report failed edition
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          edition='${{ matrix.edition }}'
          echo "::error::Edition ${edition} failed to build: the other editions keep building and the successful ones are released."
          {
            echo "### ❌ Edition \`${edition}\` failed to build"
            echo
            echo "The other editions keep building and every successful one is published as usual."
            echo "Open the **Build ${edition} image** step log above for the failing command."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
  # ---------------------------------------------------------------------------
  # UNE release par run, pas une par édition : toutes les éditions construites
  # deviennent les assets de la même release datée
  # (tag ps5-<distro>-images-<horodatage>), pour que la page Releases reste
  # lisible. Ce job crée la release (notes seules) ; le job `release` ci-dessous
  # y ajoute ensuite les volumes de chaque édition en parallèle.
  # ---------------------------------------------------------------------------
  publish:
    needs: [editions, build]
    runs-on: ubuntu-latest
    # Tourne même si des éditions ont échoué (!cancelled()) : les notes sont
    # assemblées à partir des artefacts meta-*, qui n'existent que pour les
    # builds réussis. Les éditions en échec sont listées dans le corps.
    if: ${{ !cancelled() && needs.editions.result == 'success' }}
    permissions:
      contents: write
    timeout-minutes: 20
    outputs:
      created: ${{ steps.create.outputs.created }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Download build metadata
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: meta-*
          path: meta

      - name: Compute release tag
        id: info
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y.%m.%d-%H%M%S)
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "tag=ps5-${DISTRO}-images-${stamp}" >> "$GITHUB_OUTPUT"
          echo "title=PS5 ${DISTRO^} — toutes les images (${stamp} UTC)" >> "$GITHUB_OUTPUT"
          echo "Release tag: ps5-${DISTRO}-images-${stamp}"

      - name: Assemble release notes
        id: notes
        shell: bash
        env:
          EDITIONS: ${{ needs.editions.outputs.list }}
          STAMP: ${{ steps.info.outputs.stamp }}
          KVER: ${{ needs.kernel.outputs.kver }}
          PSHA: ${{ needs.kernel.outputs.psha }}
        run: |
          set -euo pipefail
          mapfile -t editions < <(jq -r '.[]' <<<"$EDITIONS")
          published=()
          failed=()
          for edition in "${editions[@]}"; do
            if [ -f "meta/meta-${edition}/img_name" ]; then
              published+=("$edition")
            else
              failed+=("$edition")
            fi
          done

          {
            printf '# PS5 %s — toutes les images (%s UTC)\n\n' "${DISTRO^}" "$STAMP"
            printf 'Une seule release par build : les images de toutes les éditions publiées par ce run sont ici.\n\n'
            if [ -n "${KVER:-}" ] && [ "$KVER" != unknown ]; then
              printf 'Noyau : `%s` · patches [`%s`](https://github.com/ps5-linux/ps5-linux-patches/commit/%s)\n\n' "$KVER" "$PSHA" "$PSHA"
            fi
            printf 'Éditions publiées : **%d/%d**.\n\n' "${#published[@]}" "${#editions[@]}"

            if [ ${#published[@]} -gt 0 ]; then
              printf '| Édition | Image | Volumes |\n|---|---|---|\n'
              for edition in "${published[@]}"; do
                img=$(cat "meta/meta-${edition}/img_name")
                count=$(grep -c . "meta/meta-${edition}/${img}.sha256" || true)
                printf '| `%s` | `%s` | %s |\n' "$edition" "$img" "${count:-0}"
              done
              printf '\nLes volumes arrivent au fil des uploads : la release se remplit pendant que les jobs tournent.\n\n'
            fi

            for edition in "${published[@]}"; do
              m="meta/meta-${edition}"
              img=$(cat "$m/img_name")
              printf '\n---\n\n## `%s`\n\n' "$img"
              if [ -s "$m/description" ]; then
                printf '%s\n\n' "$(cat "$m/description")"
              fi
              printf -- '- Édition : `%s` (`distros/%s/%s.yaml`)\n' "$edition" "$DISTRO" "$edition"
              if [ -s "$m/kver" ]; then
                printf -- '- Noyau : `%s`\n' "$(cat "$m/kver")"
              fi
              if [ -s "$m/psha" ]; then
                printf -- '- Patches : `%s`\n' "$(cat "$m/psha")"
              fi
              if [ -s "$m/ts" ]; then
                printf -- '- Compilé : `%s` (UTC)\n' "$(cat "$m/ts")"
              fi
              printf -- '- Archives (tous les volumes, puis extraire le `.001`) :\n'
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  printf '  - `%s`\n' "$(awk '{print $2}' <<<"$line")"
                fi
              done < "$m/${img}.sha256"
              printf '\nSHA256 :\n\n```\n'
              cat "$m/${img}.sha256"
              printf '```\n'
            done

            if [ ${#failed[@]} -gt 0 ]; then
              printf '\n---\n\n## Éditions non publiées (%d)\n\n' "${#failed[@]}"
              for edition in "${failed[@]}"; do
                printf -- '- `%s` : build en échec, voir le [run](%s/%s/actions/runs/%s).\n' \
                  "$edition" "${GITHUB_SERVER_URL:-https://github.com}" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              done
            fi
          } > body.md

          cat body.md
          if [ ${#published[@]} -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Aucune édition n'a produit d'archive : aucune release n'est créée."
            exit 1
          fi

      - name: Create the release (assets are uploaded by the release matrix)
        id: create
        if: steps.notes.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ steps.info.outputs.title }}
        run: |
          set -euo pipefail
          # La release existe avant les uploads : chaque job de la matrice ajoute
          # ensuite ses propres volumes, sans se disputer la création du tag.
          # `--repo` est obligatoire : sans checkout il n'y a pas de dépôt git,
          # et `gh` échouerait sur "fatal: not a git repository".
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file body.md \
            --target "$GITHUB_SHA" --latest
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Un job par édition, uniquement pour télécharger ses volumes et les ajouter à
  # la release commune. `gh release upload` ne touche ni au titre ni au corps,
  # donc les uploads parallèles ne se marchent pas dessus.
  release:
    needs: [editions, publish]
    runs-on: ubuntu-latest
    if: ${{ needs.publish.outputs.created == 'true' }}
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.editions.outputs.list) }}
    steps:
      - name: Download built image parts
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: ps5-${{ matrix.edition }}-img
          path: output

      - name: Add volumes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(output/*.7z.*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "::warning::Aucune archive pour l'édition ${{ matrix.edition }} : rien à publier."
            exit 0
          fi
          # `--repo` : ce job n'a pas de checkout, donc pas de dépôt git à deviner.
          gh release upload "$TAG" "${parts[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # Élagage : on ne garde que KEEP_RELEASES releases datées (une par run).
  release-prune:
    needs: [publish, release]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.publish.outputs.created == 'true' }}
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Prune old dated releases
        uses: actions/github-script@v8
        env:
          DISTRO_NAME: ${{ env.DISTRO }}
          KEEP: ${{ env.KEEP_RELEASES }}
        with:
          script: |
            const keep = Number(process.env.KEEP || 5);
            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Une release par run : ps5-<distro>-images-YYYY.MM.DD-HHMMSS
            const re = new RegExp(
              `^ps5-${escape(process.env.DISTRO_NAME)}-images-\\d{4}\\.\\d{2}\\.\\d{2}-\\d{6}$`
            );

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const mine = releases
              .filter((rel) => re.test(rel.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`${mine.length} dated release(s), keeping the newest ${keep}`);
            for (const rel of mine.slice(keep)) {
              core.info(`deleting old release ${rel.tag_name} (${rel.created_at})`);
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: rel.id });
              try {
                await github.rest.git.deleteRef({ ...context.repo, ref: `tags/${rel.tag_name}` });
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e;
              }
            }
