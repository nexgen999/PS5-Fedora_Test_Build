name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    # L'outil d'édition, le comparatif et la doc ne changent pas l'image :
    # inutile de relancer toutes les éditions (plusieurs heures) pour eux.
    paths-ignore:
      - 'tools/**'
      - '**.md'
      - '.gitignore'
  pull_request_target:
    types: [labeled]
    branches: [main]

jobs:
  image:
    if: github.event.label.name == 'run-ci' || github.event_name != 'pull_request_target'
    permissions:
      contents: write
    uses: ./.github/workflows/build-image.yml
    with:
      distro: fedora
      # Empty variant + all_editions = build every edition found in
      # distros/fedora/*.yaml.
      all_editions: true
      variant: ''
