name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled]
    branches: [main]

jobs:
  image:
    if: github.event.label.name == 'run-ci' || github.event_name != 'pull_request_target'
    permissions:
      contents: write
    uses: ./.github/workflows/build-image.yml
    with:
      distro: fedora
      # Empty = build every edition found in distros/fedora/*.yaml
      variant: ''
